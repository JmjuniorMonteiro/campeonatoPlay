<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Campeonato de Play</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>1º Campeonato de Play &#x1F3AE</h1>
</header>

<main>
    <section>
        <h2>Classificação</h2>
        <table id="classificacao"></table>
        <div id="criterios"></div>
    </section>

    <section>
        <h2>Primeira Fase</h2>
        <div id="rodadas"></div>
    </section>

    <section>
        <h2>Semifinal</h2>
        <div id="semifinal"></div>
    </section>

    <section>
        <h2>Final</h2>
        <div id="final"></div>
    </section>

    <section>
        <h2>Transmissão Ao Vivo</h2>
        <div class="live-container">
            <iframe
            width="100%"
            height="360"
            src="https://www.youtube.com/embed/live_stream?channel=UCMWpPQr01HsZmy4MFLgkofQ"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
            </iframe>
        </div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
